[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  /fluent-bit/etc/parsers.conf
    HTTP_Server   On
    HTTP_Listen   127.0.0.1
    HTTP_Port     2020

[INPUT]
    Name              tail
    Tag               suricata
    Path              /data/suricata/eve.json
    Parser            json
    Read_from_Head    On
    Refresh_Interval  1
    DB                /state/suricata.db

[INPUT]
    Name              tail
    Tag               zeek.conn
    Path              /data/zeek/conn.log
    Parser            json
    Read_from_Head    On
    Refresh_Interval  1
    DB                /state/zeek_conn.db

[INPUT]
    Name              tail
    Tag               zeek.notice
    Path              /data/zeek/notice.log
    Parser            json
    Read_from_Head    On
    Refresh_Interval  1
    DB                /state/zeek_notice.db

[FILTER]
    Name    lua
    Match   *
    script  /pipeline/normalize.lua
    call    normalize

# Re-tag rejected records so they go to events-rejected (FR-02 evidence)
[FILTER]
    Name          rewrite_tag
    Match_Regex   ^(suricata|zeek).*
    Rule          $_route ^rejected$ rejected false

[OUTPUT]
    Name                opensearch
    Match_Regex         ^(suricata|zeek).*
    Host                127.0.0.1
    Port                9200
    Index               events
    Suppress_Type_Name  On
    Trace_Error         On
    Retry_Limit         5

[OUTPUT]
    Name                opensearch
    Match               rejected
    Host                127.0.0.1
    Port                9200
    Index               events-rejected
    Suppress_Type_Name  On
    Retry_Limit         5
